<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bluesky Feed Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Titillium Web', sans-serif;
      background-color: #121212;
      color: #59DCFF;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 350px;
      margin: auto;
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 0;
    }
    .byline {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #1e1e1e;
      color: #59DCFF;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      background: #59DCFF;
      color: #121212;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #00cfff;
    }
    .feed-scroll {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 15px;
    }
    .post {
      margin-bottom: 1.5em;
      padding-bottom: 1em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    a {
      color: #0ff;
      font-weight: bold;
      text-decoration: none;
    }
    small {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Bluesky Feed Widget</h2>
    <div class="byline">by <a href="https://www.gaf.nyc" target="_blank">The Gaf</a></div>
    <input type="text" id="handleInput" placeholder="Paste a handle (e.g. @jack.bsky.social)" />
    <button onclick="loadFeed()">Load Feed</button>
    <div id="feed" class="feed-scroll">Enter a handle to load a feed.</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
