<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluesky Feed Viewer</title>
  <meta name="description" content="Minimal Bluesky widget for embedding public feeds with media, hashtags, and live updates." />
  <link rel="icon" href="favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Titillium Web', sans-serif;
      background-color: #121212;
      color: #59DCFF;
      margin: 0;
      padding: 20px;
    }

    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      opacity: 1;
    }

    .container {
      max-width: 280px;
      margin: auto;
      padding: 20px;
      z-index: 1;
      position: relative;
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #FFF;
      text-align: center;
      margin-bottom: 20px;
    }

    .input-block {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      text-transform: lowercase;
      width: 130px;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      font-family: inherit;
    }

    button {
      background-color: #59DCFF;
      color: #fff;
      padding: 10px 16px;
      font-weight: 700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
    }

    .feed-box {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(89, 220, 255, 0.1);
      border-radius: 10px;
      max-height: 300px;
      min-height: 300px;
      overflow-y: auto;
      padding: 10px;
    }

    .post {
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .post h3 {
      font-size: 15px;
      font-weight: 700;
      color: #59DCFF;
      margin-bottom: 5px;
    }

    .post time {
      font-size: 13px;
      color: #ccc;
    }

    .post img, .post video {
      max-width: 100%;
      margin-top: 5px;
      border-radius: 5px;
    }

    .nav-buttons {
      text-align: center;
      margin-top: 10px;
    }

    .nav-buttons button {
      background-color: #ff66cc;
      color: #fff;
      border: 2px solid #ff66cc;
      margin: 0 5px;
    }

    .logo {
      display: block;
      max-width: 90px;
      margin: 20px auto 0 auto;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.5); }
    }

    @media (max-width: 340px) {
      .input-block {
        flex-direction: column;
      }

      input[type="text"],
      button {
        width: 100%;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <video autoplay loop muted playsinline id="bg-video">
    <source src="https://gaf.nyc/cloud.mp4" type="video/mp4">
  </video>

  <div class="container">
    <h2>🌥️ BSKY FEED VIEWER 🌥️</h2>

    <div class="input-block">
      <input type="text" id="handleInput" placeholder="Enter handle (no @)" />
      <button onclick="loadFeed()">Load Feed</button>
    </div>

    <div class="feed-box" id="feedContainer"></div>

    <div class="nav-buttons">
      <button onclick="changePage(-1)">Back</button>
      <button onclick="changePage(1)">Next</button>
    </div>

    <a href="https://gaf.nyc" target="_blank">
      <img src="https://gaf.nyc/BGtitle.svg" alt="BG Logo" class="logo" />
    </a>
  </div>

  <script src="script.js"></script>
</body>
</html>
