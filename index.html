<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluesky Feed Viewer</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Titillium Web', sans-serif;
      background-color: #121212;
      color: #59DCFF;
    }

    /* Fixed-size wrapper for Notion embedding */
    .embed-wrapper {
      width: 400px;
      height: 700px;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
      border-radius: 12px;
      box-shadow: 0 0 10px #000;
    }

    #bg-video {
      position: absolute;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      opacity: 1;
    }

    .container {
      padding: 20px;
      height: 100%;
      box-sizing: border-box;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 68%;
      padding: 10px;
      font-weight: 400;
      font-family: 'Titillium Web', sans-serif;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    button {
      background-color: #59DCFF;
      color: #ffff;
      border: none;
      padding: 10px 20px;
      font-weight: 700;
      font-family: 'Titillium Web', sans-serif;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 5px;
    }

    .feed-box {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      border: 1px solid rgba(89, 220, 255, 0.1);
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-top: 10px;
    }

    .post {
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .post h3 {
      font-size: 14px;
      font-weight: 700;
      color: #59DCFF;
      margin-bottom: 5px;
    }

    .post time {
      font-size: 12px;
      color: #ccc;
    }

    .post img,
    .post video {
      max-width: 100%;
      margin-top: 5px;
      border-radius: 5px;
    }

    .nav-buttons {
      text-align: center;
      margin-top: 10px;
    }

    .nav-buttons button {
      background-color: #ff66cc;
      color: #ffffff;
      margin: 0 5px;
      border: 2px solid #ff66cc;
    }

    .logo {
      width: 90px;
      display: block;
      margin: 15px auto 0 auto;
      animation: slowBlink 0.75s infinite alternate;
    }

    @keyframes slowBlink {
      0% { filter: brightness(1); }
      100% { filter: brightness(2); }
    }
  </style>
</head>

<body>
  <div class="embed-wrapper">
    <video autoplay loop muted playsinline id="bg-video">
      <source src="https://gaf.nyc/cloud.mp4" type="video/mp4">
    </video>

    <div class="container">
      <h2>🌥️ BSKY FEED VIEWER 🌥️</h2>
      <input type="text" id="handleInput" placeholder="Enter handle (no @)" />
      <button onclick="loadFeed()">Load Feed</button>

      <div class="feed-box" id="feedContainer"></div>
      <div class="nav-buttons">
        <button onclick="changePage(-1)">Back</button>
        <button onclick="changePage(1)">Next</button>
      </div>

      <a href="https://gaf.nyc" target="_blank">
        <img src="https://gaf.nyc/BGtitle.svg" alt="BG Logo" class="logo" />
      </a>
    </div>
  </div>

  <script>
    let posts = [];
    let currentPage = 0;
    const postsPerPage = 5;

    async function loadFeed() {
      const handle = document.getElementById("handleInput").value.trim();
      if (!handle) return;
      const response = await fetch(`/api/bluesky/feed?handle=${handle}`);
      const data = await response.json();
      posts = data.posts || [];
      currentPage = 0;
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById("feedContainer");
      container.innerHTML = "";
      const start = currentPage * postsPerPage;
      const end = start + postsPerPage;
      const currentPosts = posts.slice(start, end);

      if (currentPosts.length === 0) {
        container.innerHTML = "<p>No posts found.</p>";
        return;
      }

      currentPosts.forEach(post => {
        const div = document.createElement("div");
        div.className = "post";

        const uriParts = post.uri.split('/');
        const rkey = uriParts[uriParts.length - 1];
        const did = uriParts[2];
        const postUrl = `https://bsky.app/profile/${did}/post/${rkey}`;

        let mediaHTML = "";

        const possiblePaths = [
          post.embed?.images,
          post.embed?.record?.embed?.images,
          post.embed?.record?.record?.embed?.images,
          post.embed?.record?.record?.value?.embed?.images,
          post.embed?.record?.value?.embed?.images
        ];

        for (const path of possiblePaths) {
          if (Array.isArray(path)) {
            mediaHTML = path.map(img =>
              `<img src="${img.thumb || img.fullsize}" alt="Embedded image">`
            ).join("");
            break;
          }
        }

        // Card embed
        const card = post.embed?.record?.record?.value?.embed?.external || post.embed?.external;
        if (card?.uri && card?.title) {
          mediaHTML += `
            <div style="background:#222; padding:8px; border-radius:6px; margin-top:6px;">
              <strong style="color:#00FFFF;">${card.title}</strong><br>
              <small style="color:#ccc;">${card.description}</small><br>
              <a href="${card.uri}" target="_blank" style="color:#59DCFF;">${card.uri}</a>
            </div>`;
        }

        div.innerHTML = `
          <a href="${postUrl}" target="_blank" style="text-decoration: none; color: inherit;">
            <h3>${post.text}</h3>
            <time>${new Date(post.createdAt).toLocaleString()}</time>
            ${mediaHTML}
          </a>
        `;
        container.appendChild(div);
      });
    }

    function changePage(delta) {
      const maxPage = Math.floor(posts.length / postsPerPage);
      currentPage = Math.min(Math.max(currentPage + delta, 0), maxPage);
      renderPosts();
    }
  </script>
</body>
</html>
