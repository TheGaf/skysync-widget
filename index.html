<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluesky Feed Viewer</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Titillium Web', sans-serif;
      background-color: #121212;
      color: #59DCFF;
      text-align: left;
      padding: 20px;
      margin: 0;
    }

    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      opacity: 1;
    }

    .container {
      max-width: 300px;
      margin: auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 100%;
      max-width: 90px;
      display: block;
      margin: 0 auto 30px auto;
      animation: slowBlink 0.75s infinite alternate;
    }

    @keyframes slowBlink {
      0% { filter: brightness(1); }
      100% { filter: brightness(2); }
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 168px;
      padding: 10px;
      font-weight: 400;
      font-family: 'Titillium Web', sans-serif;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    button {
      background-color: #59DCFF;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-weight: 700;
      font-family: 'Titillium Web', sans-serif;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    .feed-box {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      border: 1px solid rgba(89, 220, 255, 0.1);
      max-height: 350px;
      min-height: 350px;
      overflow-y: auto;
      padding: 10px;
    }

    .post {
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .post h3 {
      font-size: 15px;
      font-weight: 700;
      color: #59DCFF;
      margin-bottom: 5px;
    }

    .post time {
      font-size: 13px;
      color: #ccc;
    }

    .post img,
    .post video {
      max-width: 100%;
      margin-top: 5px;
      border-radius: 5px;
    }

    .nav-buttons {
      text-align: center;
      margin-top: 10px;
    }

    .nav-buttons button {
      background-color: #ff66cc;
      color: #ffffff;
      margin: 0 5px;
      border: 2px solid #ff66cc;
    }

    a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      animation: blink 2s infinite;
    }

    a:hover {
      color: #FBAE17;
      animation: none;
    }

    @keyframes blink {
      0% { color: #FFFFFF; }
      50% { color: #00FF33; }
      100% { color: #FFFFFF; }
    }
  </style>
</head>

<body>
  <video autoplay loop muted playsinline id="bg-video">
    <source src="https://gaf.nyc/cloud.mp4" type="video/mp4">
  </video>

  <div class="container">
    <h2>🌥️ BSKY FEED VIEWER 🌥️</h2>
    <input type="text" id="handleInput" placeholder="Enter handle (no @)" />
    <button onclick="loadFeed()">Load Feed</button>

    <div class="feed-box" id="feedContainer"></div>
    <div class="nav-buttons">
      <button onclick="changePage(-1)">Back</button>
      <button onclick="changePage(1)">Next</button>
    </div>

    <p style="text-align:center; font-size: 13px;"><br>
      <a href="https://gaf.nyc" target="_blank">
        <img src="https://gaf.nyc/BGtitle.svg" alt="BG Logo" class="logo" />
      </a>
    </p>
  </div>

  <script>
    let posts = [];
    let currentPage = 0;
    const postsPerPage = 5;

    async function loadFeed() {
      const handle = document.getElementById("handleInput").value.trim();
      if (!handle) return;

      const response = await fetch(`/api/bluesky/feed?handle=${handle}`);
      const data = await response.json();

      console.log("Embed debug:", data.posts.map(p => ({
        text: p.text,
        uri: p.uri,
        embed: p.embed
      })));

      posts = data.posts || [];
      currentPage = 0;
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById("feedContainer");
      container.innerHTML = "";
      const start = currentPage * postsPerPage;
      const end = start + postsPerPage;
      const currentPosts = posts.slice(start, end);

      if (currentPosts.length === 0) {
        container.innerHTML = "<p>No posts found.</p>";
        return;
      }

      currentPosts.forEach(post => {
        const div = document.createElement("div");
        div.className = "post";

        const uriParts = post.uri.split('/');
        const rkey = uriParts[uriParts.length - 1];
        const did = uriParts[2];
        const postUrl = `https://bsky.app/profile/${did}/post/${rkey}`;

        // Search multiple paths for images
        const possiblePaths = [
          post.embed?.images,
          post.embed?.record?.embed?.images,
          post.embed?.record?.record?.embed?.images,
          post.embed?.record?.record?.value?.embed?.images,
          post.embed?.record?.value?.embed?.images
        ];

        let mediaHTML = "";

        for (const path of possiblePaths) {
          if (Array.isArray(path)) {
            mediaHTML = path.map(img =>
              `<img src="${img.thumb || img.fullsize}" alt="Embedded image">`
            ).join("");
            break;
          }
        }

        div.innerHTML = `
          <a href="${postUrl}" target="_blank" style="text-decoration: none; color: inherit;">
            <h3>${post.text}</h3>
            <time>${new Date(post.createdAt).toLocaleString()}</time>
            ${mediaHTML}
          </a>
        `;

        container.appendChild(div);
      });
    }

    function changePage(delta) {
      const maxPage = Math.floor(posts.length / postsPerPage);
      currentPage = Math.min(Math.max(currentPage + delta, 0), maxPage);
      renderPosts();
    }
  </script>
</body>

</html>
