<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bluesky Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 2rem;
    }

    .widget {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #161b22;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }

    input[type="text"] {
      width: 70%;
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      margin-right: 0.5rem;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #238636;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 0.5rem;
    }

    button:hover {
      background-color: #2ea043;
    }

    .feed-window {
      height: 400px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .post {
      margin-bottom: 1.5em;
      padding-bottom: 1em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pagination {
      margin-top: 1rem;
      text-align: center;
    }

    .footer {
      font-size: 0.8rem;
      color: #8b949e;
      text-align: center;
      margin-top: 1.5rem;
    }

    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="widget">
    <h1>Bluesky Feed Viewer</h1>
    <p>Enter any handle (without @):</p>
    <input type="text" id="handleInput" placeholder="e.g. gaf.nyc">
    <button id="loadButton">Load Feed</button>

    <div class="feed-window">
      <div id="postsContainer"></div>
    </div>

    <div class="pagination">
      <button id="prevBtn">Back</button>
      <button id="nextBtn">Next</button>
    </div>

    <div class="footer">
      by <a href="https://www.gaf.nyc" target="_blank">The Gaf</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
